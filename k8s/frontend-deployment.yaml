apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: frontend-app:latest
        imagePullPolicy: Never # Adjust if pushing to a registry
        ports:
        - containerPort: 5173
        env:
        - name: VITE_API_BASE
          value: "http://localhost:4001/user" # Browser-accessible URL
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
