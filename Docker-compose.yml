version: "3.8"

services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=mongodb://mongo:27017/lead_distribution
      - JWT_SECRET=supersecret_jwt_key
      - JWT_EXPIRES_IN=1h
    depends_on:
      - mongo

  frontend:
    build: ./frontend/frontend-proj
    ports:
      - "3002:5173"
    environment:
      - VITE_API_BASE=http://localhost:4000/user
    depends_on:
      - backend

volumes:
  mongo_data: